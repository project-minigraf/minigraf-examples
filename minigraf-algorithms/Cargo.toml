[package]
name = "minigraf-algorithms"
version = "0.2.0"
edition = "2024"
description = "Graph algorithms for Minigraf ecosystem crates"
license = "MIT OR Apache-2.0"
repository = "https://github.com/project-minigraf/minigraf-examples"
readme = "README.md"
keywords = ["graph", "minigraf", "algorithms", "traversal", "topological-sort"]
categories = ["data-structures", "database-interfaces"]

[dependencies]
anyhow = "1.0"
minigraf = "2.0"
uuid = { version = "1", features = ["v5"] }
